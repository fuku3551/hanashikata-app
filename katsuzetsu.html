<!doctype html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滑舌練習｜一人話し方GYM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #f5f0e8;
–bg-card: #fffdf7;
–text: #2c2520;
–text-sub: #7a6e62;
–accent: #c0392b;
–accent-light: rgba(192, 57, 43, .08);
–blue: #2980b9;
–blue-light: rgba(41, 128, 185, .1);
–green: #27ae60;
–green-light: rgba(39, 174, 96, .1);
–orange: #e67e22;
–orange-light: rgba(230, 126, 34, .1);
–border: rgba(44, 37, 32, .1);
–shadow: 0 2px 12px rgba(44, 37, 32, .06);
–radius: 16px;
–radius-sm: 10px;
–font-body: ‘Zen Kaku Gothic New’, ‘Hiragino Sans’, sans-serif;
–font-serif: ‘Noto Serif JP’, serif;
}

body {
font-family: var(–font-body);
background: var(–bg);
color: var(–text);
line-height: 1.7;
min-height: 100vh;
-webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.header {
background: linear-gradient(135deg, #2c2520 0%, #4a3728 100%);
color: #fff; padding: 20px 20px 18px; text-align: center;
position: relative; overflow: hidden;
}
.header::before {
content: ‘’; position: absolute; inset: 0;
background: radial-gradient(ellipse at 30% 0%, rgba(192,57,43,.12) 0%, transparent 60%);
pointer-events: none;
}
.header h1 {
font-family: var(–font-serif); font-size: 22px; font-weight: 700;
letter-spacing: .08em; position: relative;
}
.header .sub { font-size: 12px; opacity: .65; margin-top: 4px; position: relative; }
.header .back-link {
display: inline-block; margin-top: 8px; color: rgba(255,255,255,.7);
text-decoration: none; font-size: 13px; position: relative; z-index: 10;
padding: 6px 12px; -webkit-tap-highlight-color: rgba(255,255,255,.15);
touch-action: manipulation;
}
.header .back-link:hover { color: #fff; }

.container { max-width: 700px; margin: 0 auto; padding: 16px; }

/* ===== CARD ===== */
.card {
background: var(–bg-card); border: 1px solid var(–border);
border-radius: var(–radius); box-shadow: var(–shadow);
margin-bottom: 16px; overflow: hidden;
}
.card-header {
padding: 14px 18px 10px; border-bottom: 1px solid var(–border);
display: flex; align-items: center; gap: 8px;
}
.card-header .icon { font-size: 16px; }
.card-header .label { font-weight: 700; font-size: 15px; letter-spacing: .03em; }
.card-body { padding: 16px 18px; }

/* ===== ONBOARDING ===== */
.onboarding {
background: linear-gradient(135deg, var(–blue-light), var(–green-light));
border: 1px solid var(–border); border-radius: var(–radius);
padding: 16px 18px; margin-bottom: 16px; position: relative;
animation: slideDown .5s ease-out;
}
@keyframes slideDown {
from { opacity: 0; transform: translateY(-12px); }
to { opacity: 1; transform: translateY(0); }
}
.onboarding-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; color: var(–blue); }
.onboarding-steps { display: flex; flex-direction: column; gap: 6px; }
.onboarding-step { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.6; }
.ob-num {
flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
background: var(–blue); color: #fff;
display: flex; align-items: center; justify-content: center;
font-size: 11px; font-weight: 700; margin-top: 1px;
}
.onboarding .close-btn {
position: absolute; top: 10px; right: 12px;
background: none; border: none; font-size: 18px;
color: var(–text-sub); cursor: pointer; line-height: 1; padding: 4px;
}

/* ===== MODE SELECTOR ===== */
.mode-selector { display: flex; gap: 8px; margin-bottom: 14px; }
.mode-btn {
flex: 1; padding: 10px 8px; border-radius: var(–radius-sm);
border: 2px solid var(–border); background: #fff;
font-family: var(–font-body); font-size: 13px; font-weight: 700;
text-align: center; cursor: pointer; transition: all .15s;
-webkit-tap-highlight-color: transparent; touch-action: manipulation;
color: var(–text-sub);
}
.mode-btn:active { transform: scale(.97); }
.mode-btn.active { border-color: var(–green); background: var(–green-light); color: var(–green); }

/* ===== STEP INDICATOR ===== */
.steps-indicator {
display: flex; align-items: center; justify-content: center;
gap: 0; padding: 12px 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.step-item { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 44px; }
.step-circle {
width: 28px; height: 28px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 11px; font-weight: 700;
border: 2px solid var(–border); background: #fff; color: var(–text-sub);
transition: all .3s;
}
.step-circle.active {
border-color: var(–green); background: var(–green); color: #fff;
box-shadow: 0 2px 8px rgba(39,174,96,.3);
animation: stepPulse 1.5s ease infinite;
}
@keyframes stepPulse {
0%,100% { box-shadow: 0 2px 8px rgba(39,174,96,.3); }
50% { box-shadow: 0 2px 14px rgba(39,174,96,.5); }
}
.step-circle.done { border-color: var(–green); background: var(–green-light); color: var(–green); }
.step-label { font-size: 9px; font-weight: 600; color: var(–text-sub); white-space: nowrap; }
.step-item.active .step-label { color: var(–green); font-weight: 700; }
.step-item.done .step-label { color: var(–green); }
.step-connector {
width: 12px; height: 2px; background: var(–border);
margin-bottom: 16px; flex-shrink: 0; transition: background .3s;
}
.step-connector.done { background: var(–green); }

/* ===== ANNOUNCE ===== */
.announce-bar {
background: var(–blue-light); border: 1px solid rgba(41,128,185,.15);
border-radius: var(–radius-sm); padding: 10px 14px; margin-bottom: 12px;
font-size: 13px; font-weight: 600; color: var(–blue);
text-align: center; line-height: 1.6; min-height: 40px;
display: flex; align-items: center; justify-content: center;
}
.announce-bar.phase-info {
background: var(–orange-light); border-color: rgba(230,126,34,.15); color: var(–orange);
}

/* ===== STATUS ===== */
.status-bar {
display: flex; align-items: center; justify-content: center;
gap: 10px; padding: 6px 0; font-size: 12px; color: var(–text-sub);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.idle { background: #bbb; }
.status-dot.playing { background: var(–green); animation: pulse 1.2s infinite; }
.status-dot.paused-dot { background: var(–orange); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

/* ===== DISPLAY ===== */
.display-area {
min-height: 140px; display: flex; flex-direction: column;
align-items: center; justify-content: center; padding: 16px 8px; text-align: center;
}
.display-phase { font-size: 13px; font-weight: 700; color: var(–text-sub); margin-bottom: 6px; }
.display-sub { font-size: 13px; color: var(–text-sub); margin-top: 8px; line-height: 1.6; }

/* ===== KARAOKE ===== */
.phrase-display {
font-family: var(–font-serif); font-size: 30px; font-weight: 700;
line-height: 2.0; text-align: center; word-break: break-word;
}
.kara-unit {
display: inline-block; padding: 2px 3px; border-radius: 6px; transition: all .12s;
}
.kara-unit.active { background: var(–accent-light); color: var(–accent); }
.kara-unit.done { opacity: .35; }
.kara-unit.spacer { background: transparent; color: inherit; opacity: 1; }

/* ===== HARD PHRASE ===== */
.hard-phrase {
font-family: var(–font-serif); font-size: 26px; font-weight: 700; line-height: 1.7;
background: var(–accent-light); border: 1px solid rgba(192,57,43,.15);
border-radius: var(–radius-sm); padding: 14px 18px; display: inline-block;
}
.hard-phrase ruby rt { font-size: .48em; color: var(–accent); opacity: .8; }

/* ===== PROGRESS ===== */
.progress-wrap {
margin-top: 10px; background: rgba(0,0,0,.06);
border-radius: 4px; height: 5px; overflow: hidden;
}
.progress-bar {
height: 100%; width: 0%; background: var(–green);
border-radius: 4px; transition: width .4s ease;
}

/* ===== CONTROLS ===== */
.controls-wrap { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(–border); }
.controls-main { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn {
display: inline-flex; align-items: center; gap: 6px;
padding: 11px 18px; border-radius: var(–radius-sm);
border: 1px solid var(–border); background: #fff;
font-family: var(–font-body); font-size: 14px; font-weight: 600;
cursor: pointer; transition: all .15s; white-space: nowrap;
-webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:disabled:active { transform: none; }
.btn-start {
background: var(–green); color: #fff; border-color: var(–green);
box-shadow: 0 2px 8px rgba(39,174,96,.25);
min-width: 160px; font-size: 16px; padding: 13px 24px;
}
.btn-start:hover:not(:disabled) { background: #219a52; }
.btn-pause { background: var(–blue); color: #fff; border-color: var(–blue); }
.btn-resume { background: var(–green); color: #fff; border-color: var(–green); }
.btn-stop { background: var(–accent); color: #fff; border-color: var(–accent); }
.btn-skip { background: #2c2520; color: #fff; border-color: #2c2520; }
.btn-ghost { background: #fff; color: var(–text); }
.controls-secondary {
display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;
}

/* ===== TIPS ===== */
.tips {
background: var(–accent-light); border-radius: var(–radius-sm);
padding: 12px 14px; margin-top: 14px;
}
.tips-title { font-size: 13px; font-weight: 700; color: var(–accent); margin-bottom: 6px; }
.tips-text { font-size: 12px; line-height: 1.8; color: var(–text-sub); }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
.container { padding: 10px; }
.card-body { padding: 12px 14px; }
.phrase-display { font-size: 24px; }
.hard-phrase { font-size: 20px; padding: 10px 14px; }
.btn { padding: 10px 14px; font-size: 13px; }
.btn-start { padding: 12px 20px; font-size: 15px; min-width: 140px; }
.step-circle { width: 26px; height: 26px; font-size: 10px; }
.step-connector { width: 8px; }
.mode-btn { font-size: 12px; padding: 9px 6px; }
}
</style>

/* ======================================================
   状態管理
====================================================== */
var runToken = 0;
var paused = false;
var pauseResolvers = [];
var skipRequested = false;
var currentMode = 'mission'; // 'mission' or 'all'

var KARA_SPEED = 700; // ms per unit
var HARD_SPEED = 3500; // ms per hard phrase

function waitWhilePaused() {
  if (!paused) return Promise.resolve();
  return new Promise(function(res) { pauseResolvers.push(res); });
}
function resumePausedWaiters() {
  pauseResolvers.splice(0).forEach(function(r) { r(); });
}
function isStopped(token) { return token !== runToken; }

/* ======================================================
   DOM
====================================================== */
function $(id) { return document.getElementById(id); }

function setAnnounce(text, type) {
  var bar = $('announceBar');
  bar.textContent = text;
  bar.className = 'announce-bar' + (type ? ' ' + type : '');
}

function setStatus(state) {
  var dot = $('statusDot');
  var txt = $('statusText');
  if (state === 'playing') {
    dot.className = 'status-dot playing';
    txt.textContent = '進行中';
  } else if (state === 'paused') {
    dot.className = 'status-dot paused-dot';
    txt.textContent = '一時停止中';
  } else if (state === 'complete') {
    dot.className = 'status-dot idle';
    txt.textContent = '完了';
  } else {
    dot.className = 'status-dot idle';
    txt.textContent = '待機中';
  }
}

function setProgress(pct) {
  $('progressBar').style.width = Math.min(100, pct) + '%';
}

/* ======================================================
   Step Indicator (dynamic)
====================================================== */
function buildStepIndicator(sections) {
  var container = $('stepsIndicator');
  container.innerHTML = '';
  for (var i = 0; i < sections.length; i++) {
    var item = document.createElement('div');
    item.className = 'step-item';
    item.id = 'step-' + i;
    item.innerHTML = '<div class="step-circle" id="circle-' + i + '">' + (i + 1) + '</div>' +
                     '<span class="step-label">' + sections[i].name + '</span>';
    container.appendChild(item);
    if (i < sections.length - 1) {
      var conn = document.createElement('div');
      conn.className = 'step-connector';
      conn.id = 'conn-' + i;
      container.appendChild(conn);
    }
  }
}

function updateStep(activeIdx, doneUpTo, total) {
  for (var i = 0; i < total; i++) {
    var item = $('step-' + i);
    var circle = $('circle-' + i);
    if (!item || !circle) continue;
    item.className = 'step-item';
    circle.className = 'step-circle';
    if (i < doneUpTo) {
      item.classList.add('done');
      circle.classList.add('done');
      circle.innerHTML = '&#10003;';
    } else if (i === activeIdx) {
      item.classList.add('active');
      circle.classList.add('active');
      circle.textContent = String(i + 1);
    } else {
      circle.textContent = String(i + 1);
    }
    if (i < total - 1) {
      var conn = $('conn-' + i);
      if (conn) conn.className = 'step-connector' + (i < doneUpTo ? ' done' : '');
    }
  }
}

function resetStep(total) {
  for (var i = 0; i < total; i++) {
    var item = $('step-' + i);
    var circle = $('circle-' + i);
    if (!item || !circle) continue;
    item.className = 'step-item';
    circle.className = 'step-circle';
    circle.textContent = String(i + 1);
    if (i < total - 1) {
      var conn = $('conn-' + i);
      if (conn) conn.className = 'step-connector';
    }
  }
}

/* ======================================================

====================================================== */
function buildUnits(text) {
  var small = 'ゃゅょぁぃぅぇぉ';
  var arr = [];
  var buf = '';
  for (var ci = 0; ci < text.length; ci++) {
    var c = text[ci];
    if (/\s/.test(c) || c === '\u3000') {
      if (buf) { arr.push({t: buf}); buf = ''; }
      arr.push({t: c, spacer: true});
      continue;
    }
    if (small.indexOf(c) >= 0) {
      buf += c;
      continue;
    } else {
      if (buf) arr.push({t: buf});
      buf = c;
    }
  }
  if (buf) arr.push({t: buf});
  return arr;
}

/* ======================================================
   Render functions
====================================================== */
function renderKaraoke(text) {
  var area = $('displayArea');
  var units = buildUnits(text);
  var html = '<div class="phrase-display">';
  for (var i = 0; i < units.length; i++) {
    var u = units[i];
    if (u.spacer) {
      html += '<span class="kara-unit spacer">' + u.t + '</span>';
    } else {
      html += '<span class="kara-unit" data-idx="' + i + '">' + u.t + '</span>';
    }
  }
  html += '</div>';
  area.innerHTML = html;
}

function renderHardPhrase(rubyHtml) {
  var area = $('displayArea');
  area.innerHTML = '<div class="hard-phrase">' + rubyHtml + '</div>';
}

function renderWelcome() {
  var area = $('displayArea');
  area.innerHTML =
    '<div class="display-phase">準備OK</div>' +
    '<div class="phrase-display" style="font-size:16px; opacity:.7;">スタートを押してください</div>';
}

/* ======================================================
   Wait utility
====================================================== */
function wait(ms, token) {
  var left = ms;
  var step = 50;
  return new Promise(function(resolve) {
    function tick() {
      if (isStopped(token) || skipRequested) { resolve(false); return; }
      if (paused) { waitWhilePaused().then(tick); return; }
      if (left <= 0) { resolve(true); return; }
      var chunk = Math.min(step, left);
      left -= chunk;
      setTimeout(tick, chunk);
    }
    tick();
  });
}

/* ======================================================
   Karaoke play (animate units one by one)
====================================================== */
function playKaraoke(token) {
  var spans = [];
  var all = document.querySelectorAll('.kara-unit');
  for (var i = 0; i < all.length; i++) {
    if (!all[i].classList.contains('spacer')) spans.push(all[i]);
  }
  if (spans.length === 0) return Promise.resolve(true);

  var idx = 0;
  function step() {
    if (isStopped(token) || skipRequested) return Promise.resolve(false);

    if (idx > 0) {
      spans[idx - 1].classList.remove('active');
      spans[idx - 1].classList.add('done');
    }
    if (idx >= spans.length) return Promise.resolve(true);

    spans[idx].classList.add('active');
    idx++;
    return wait(KARA_SPEED, token).then(function(ok) {
      return ok ? step() : false;
    });
  }
  return step();
}

/* ======================================================
   Play section
====================================================== */
function playSection(token, section, phraseList, sectionIdx, totalSections, progressBase, progressSpan) {
  var pIdx = 0;

  function nextPhrase() {
    if (pIdx >= phraseList.length || isStopped(token) || skipRequested) return Promise.resolve();

    var phraseNum = pIdx + 1;
    var totalPhrases = phraseList.length;

    if (section.isHard) {
      // Hard phrase: show with ruby, wait, then next
      setAnnounce(section.name + '（' + phraseNum + '/' + totalPhrases + '）：ゆっくり声に出しましょう');
      renderHardPhrase(phraseList[pIdx]);
      return wait(HARD_SPEED, token).then(function(ok) {
        if (!ok) return;
        var pct = progressBase + ((pIdx + 1) / totalPhrases) * progressSpan;
        setProgress(pct);
        pIdx++;
        return nextPhrase();
      });
    } else {
      // Normal karaoke
      setAnnounce(section.name + '（' + phraseNum + '/' + totalPhrases + '）：' + section.desc);
      renderKaraoke(phraseList[pIdx]);
      return playKaraoke(token).then(function(ok) {
        if (!ok) return;
        var pct = progressBase + ((pIdx + 1) / totalPhrases) * progressSpan;
        setProgress(pct);
        return wait(400, token);
      }).then(function(ok) {
        if (ok === undefined) return; // stopped
        pIdx++;
        return nextPhrase();
      });
    }
  }

  return nextPhrase();
}

/* ======================================================
   Build playlist based on mode
====================================================== */
function buildPlaylist() {
  var playlist = [];
  for (var i = 0; i < SECTIONS.length; i++) {
    var sec = SECTIONS[i];
    var phrases;
    if (currentMode === 'mission') {
      // Pick one random phrase per section
      var ridx = Math.floor(Math.random() * sec.phrases.length);
      phrases = [sec.phrases[ridx]];
    } else {
      // All phrases in order
      phrases = sec.phrases.slice();
    }
    playlist.push({section: sec, phrases: phrases});
  }
  return playlist;
}

/* ======================================================
   Onboarding
====================================================== */
function closeOnboarding() {
  var el = $('onboarding');
  el.style.opacity = '0';
  el.style.transform = 'translateY(-10px)';
  el.style.transition = 'all .3s ease';
  setTimeout(function() { el.style.display = 'none'; }, 300);
  try { localStorage.setItem('katsuzetsu_onboarding_closed', '1'); } catch (e) {}
}
try {
  if (localStorage.getItem('katsuzetsu_onboarding_closed') === '1') {
    $('onboarding').style.display = 'none';
  }
} catch (e) {}

/* ======================================================
   Controls
====================================================== */
function showRunningControls(on) {
  $('controlsMain').style.display = on ? 'none' : 'flex';
  $('controlsSec').style.display = on ? 'flex' : 'none';
}

function togglePause() {
  paused = !paused;
  var btn = $('pauseBtn');
  if (paused) {
    btn.textContent = '\u25B6 再開';
    btn.className = 'btn btn-resume';
    setStatus('paused');
  } else {
    btn.textContent = '\u23F8 一時停止';
    btn.className = 'btn btn-pause';
    setStatus('playing');
    resumePausedWaiters();
  }
}

function skipPhase() {
  skipRequested = true;
  resumePausedWaiters();
}

function stopAll() {
  runToken++;
  paused = false;
  resumePausedWaiters();
  skipRequested = false;

  buildStepIndicator(SECTIONS);
  resetStep(SECTIONS.length);
  setProgress(0);
  setStatus('idle');
  setAnnounce('スタートを押すと、母音から順にガイドします');
  showRunningControls(false);
  renderWelcome();

  $('pauseBtn').textContent = '\u23F8 一時停止';
  $('pauseBtn').className = 'btn btn-pause';

  // Re-enable mode buttons
  $('modeMission').disabled = false;
  $('modeAll').disabled = false;
  $('modeMission').style.opacity = '1';
  $('modeAll').style.opacity = '1';
}

/* ======================================================
   Main flow
====================================================== */
function startAll() {
  runToken++;
  var token = runToken;

  paused = false;
  resumePausedWaiters();
  skipRequested = false;

  // Disable mode buttons during play
  $('modeMission').disabled = true;
  $('modeAll').disabled = true;
  $('modeMission').style.opacity = '.5';
  $('modeAll').style.opacity = '.5';

  $('pauseBtn').textContent = '\u23F8 一時停止';
  $('pauseBtn').className = 'btn btn-pause';

  var playlist = buildPlaylist();
  var totalSections = playlist.length;

  buildStepIndicator(SECTIONS);
  showRunningControls(true);
  setStatus('playing');

  var sIdx = 0;

  function nextSection() {
    if (sIdx >= totalSections || isStopped(token)) return Promise.resolve();

    skipRequested = false;
    updateStep(sIdx, sIdx, totalSections);

    var item = playlist[sIdx];
    var progressBase = (sIdx / totalSections) * 100;
    var progressSpan = (1 / totalSections) * 100;

    // Announce section
    setAnnounce(item.section.name + '：' + item.section.desc, 'phase-info');

    return wait(1000, token).then(function(ok) {
      if (!ok) return;
      return playSection(token, item.section, item.phrases, sIdx, totalSections, progressBase, progressSpan);
    }).then(function() {
      if (isStopped(token)) return;
      updateStep(sIdx + 1, sIdx + 1, totalSections);
      sIdx++;
      return nextSection();
    });
  }

  nextSection().then(function() {
    if (isStopped(token)) return;

    // Complete!
    updateStep(-1, totalSections, totalSections);
    setProgress(100);
    setStatus('complete');
    setAnnounce('すべてのセクションが完了しました！');

    var modeLabel = currentMode === 'mission' ? 'ミッション' : '全問練習';
    $('displayArea').innerHTML =
      '<div style="text-align:center; padding:10px 0;">' +
        '<div style="font-size:48px; margin-bottom:8px;">&#127881;</div>' +
        '<div style="font-family:var(--font-serif); font-size:20px; font-weight:700; margin-bottom:6px;">お疲れさまでした！</div>' +
        '<div style="font-size:14px; color:var(--text-sub); line-height:1.8; margin-bottom:14px;">' +
          modeLabel + '完了です。<br>毎日続けて滑舌力をアップ！' +
        '</div>' +
        '<div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">' +
          '<button class="btn btn-start" onclick="startAll()" type="button" style="min-width:auto;">もう一度</button>' +
          '<a href="index.html" class="btn btn-ghost" style="text-decoration:none;">ホームへ</a>' +
        '</div>' +
      '</div>';

    showRunningControls(false);
    $('modeMission').disabled = false;
    $('modeAll').disabled = false;
    $('modeMission').style.opacity = '1';
    $('modeAll').style.opacity = '1';
  }).catch(function(e) {
    console.error(e);
  });
}

/* ======================================================
   Mode switching
====================================================== */
function setMode(mode) {
  currentMode = mode;
  $('modeMission').className = 'mode-btn' + (mode === 'mission' ? ' active' : '');
  $('modeAll').className = 'mode-btn' + (mode === 'all' ? ' active' : '');

  if (mode === 'mission') {
    setAnnounce('ミッション：各ジャンルから1問ずつ出題されます');
  } else {
    setAnnounce('全問練習：全フレーズを順番に練習します');
  }
}

/* ======================================================
   Event listeners
====================================================== */
document.addEventListener('DOMContentLoaded', function() {
  $('startBtn').addEventListener('click', startAll);
  $('pauseBtn').addEventListener('click', togglePause);
  $('stopBtn').addEventListener('click', stopAll);
  $('skipBtn').addEventListener('click', skipPhase);

  $('modeMission').addEventListener('click', function() { setMode('mission'); });
  $('modeAll').addEventListener('click', function() { setMode('all'); });

  // Initial state
  buildStepIndicator(SECTIONS);
  renderWelcome();
});
</script>
