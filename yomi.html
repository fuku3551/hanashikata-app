<html lang="ja">
<head>

<title>読み練習（外郎売）縦書き｜一人話し方GYM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f0e8;
  --bg-card: #fffdf7;
  --text: #2c2520;
  --text-sub: #7a6e62;
  --accent: #c0392b;
  --accent-light: rgba(192, 57, 43, .08);
  --blue: #2980b9;
  --blue-light: rgba(41, 128, 185, .1);
  --green: #27ae60;
  --green-light: rgba(39, 174, 96, .1);
  --border: rgba(44, 37, 32, .1);
  --shadow: 0 2px 12px rgba(44, 37, 32, .06);
  --radius: 16px;
  --radius-sm: 10px;
  --font-body: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  --font-serif: 'Noto Serif JP', '游明朝', serif;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: linear-gradient(135deg, #2c2520 0%, #4a3728 100%);
  color: #fff;
  padding: 20px 20px 18px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 0%, rgba(192,57,43,.15) 0%, transparent 60%);
  pointer-events: none;
}
.header h1 {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .08em;
  position: relative;
}
.header .sub {
  font-size: 12px;
  opacity: .65;
  margin-top: 4px;
  letter-spacing: .04em;
  position: relative;
}
.header .back-link {
  display: inline-block;
  margin-top: 8px;
  color: rgba(255,255,255,.7);
  text-decoration: none;
  font-size: 13px;
  transition: color .2s;
  position: relative;
}
.header .back-link:hover { color: #fff; }

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px;
}

/* ===== ONBOARDING ===== */
.onboarding {
  background: linear-gradient(135deg, var(--blue-light), var(--green-light));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
  position: relative;
  animation: slideDown .5s ease-out;
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}
.onboarding-title {
  font-weight: 700; font-size: 15px; margin-bottom: 8px; color: var(--blue);
}
.onboarding-steps { display: flex; flex-direction: column; gap: 6px; }
.onboarding-step {
  display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.6;
}
.step-num {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
  background: var(--blue); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; margin-top: 1px;
}
.onboarding .close-btn {
  position: absolute; top: 10px; right: 12px;
  background: none; border: none; font-size: 18px;
  color: var(--text-sub); cursor: pointer; line-height: 1; padding: 4px;
}

/* ===== CARD ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
}
.card-header {
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.card-header .icon { font-size: 18px; }
.card-header .label { font-weight: 700; font-size: 15px; letter-spacing: .03em; }
.card-body { padding: 16px 18px; }

/* ===== CONTROLS ===== */
.controls-main {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: #fff;
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .15s ease; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.97); }
.btn-start {
  background: var(--green); color: #fff; border-color: var(--green);
  box-shadow: 0 2px 8px rgba(39, 174, 96, .25);
}
.btn-start:hover { background: #219a52; }
.btn-stop {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(192, 57, 43, .2);
}
.btn-stop:hover { background: #a93226; }
.btn-reset { background: var(--bg); color: var(--text); }

.slider-group {
  display: flex; align-items: center; gap: 8px;
  justify-content: center; flex-wrap: wrap; margin-top: 12px;
}
.slider-label {
  font-size: 12px; font-weight: 600; color: var(--text-sub);
  min-width: 56px; text-align: right;
}
.slider-value {
  font-size: 12px; font-weight: 700; color: var(--accent);
  background: var(--accent-light); padding: 2px 10px;
  border-radius: 999px; min-width: 60px; text-align: center;
}
.slider-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border); background: #fff;
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; -webkit-tap-highlight-color: transparent;
}
.slider-btn:active { transform: scale(.92); }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 160px; height: 6px; border-radius: 3px;
  background: var(--border); outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--accent);
  border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: pointer;
}

/* ===== READER ===== */
#reader {
  position: relative;
  height: 55vh;
  min-height: 320px;
  overflow-x: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  touch-action: auto;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: #fffef9;
  /* ✅ 右パディングでふりがなが枠に当たらないよう余白確保 */
  padding: 16px 50px 16px 16px;
  box-shadow: inset 0 1px 4px rgba(0,0,0,.03);
  /* ✅ スクロール方向を反転（右スライドで読み進む） */
  direction: rtl;
}

#textBody {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  line-height: 2.0;
  letter-spacing: .04em;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  min-height: 100%;
  height: max-content;
  direction: ltr; /* ✅ テキスト自体は通常方向に戻す */
}

ruby { ruby-position: over; ruby-align: center; }
ruby rt {
  font-size: .52em; opacity: .78; letter-spacing: .02em;
  line-height: 1.1; text-orientation: mixed; color: var(--accent);
}

/* ===== STATUS & PROGRESS ===== */
.status-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 10px 0 8px; font-size: 12px; color: var(--text-sub);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.idle { background: #bbb; }
.status-dot.playing { background: var(--green); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

.progress-wrap {
  margin-top: 8px; background: rgba(0,0,0,.06);
  border-radius: 4px; height: 5px; overflow: hidden;
}
.progress-bar {
  height: 100%; width: 0%; background: var(--green);
  border-radius: 4px; transition: width .3s ease;
}

.tips {
  background: var(--accent-light); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-top: 12px;
}
.tips-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.tips-text { font-size: 12px; line-height: 1.7; color: var(--text-sub); }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .container { padding: 10px; }
  .card-body { padding: 12px 14px; }
  #reader { height: 50vh; min-height: 280px; padding: 14px 44px 14px 12px; }
  #textBody { font-size: 16px; }
  input[type="range"] { width: 120px; }
  .btn { padding: 9px 14px; font-size: 13px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  #reader { height: 65vh; min-height: 250px; }
  .header { padding: 10px 20px; }
  .header h1 { font-size: 18px; }
}
</style>
</head>

<div class="header">
  <h1>📖 読み練習（外郎売）</h1>
  <p class="sub">縦書き（右→左）｜スマホ横向き推奨</p>
  <a href="index.html" class="back-link">← ホームへ戻る</a>
</div>

<div class="container">

  <!-- 初回ガイド -->
  <div class="onboarding" id="onboarding">
    <button class="close-btn" onclick="closeOnboarding()" aria-label="閉じる">✕</button>
    <div class="onboarding-title">🎯 はじめての方へ — 3ステップで練習開始！</div>
    <div class="onboarding-steps">
      <div class="onboarding-step">
        <span class="step-num">1</span>
        <span>本文エリアを<strong>横にスワイプ</strong>して、縦書きの外郎売を読み進めます</span>
      </div>
      <div class="onboarding-step">
        <span class="step-num">2</span>
        <span><strong>▶ 開始</strong>ボタンで自動スクロール。速度は自由に調整できます</span>
      </div>
      <div class="onboarding-step">
        <span class="step-num">3</span>
        <span>声に出して読みましょう！ふりがな付きなので安心です</span>
      </div>
    </div>
  </div>

  <!-- 操作パネル -->
  <div class="card">
    <div class="card-header">
      <span class="icon">🎛️</span>
      <span class="label">操作パネル</span>
    </div>
    <div class="card-body">
      <div class="controls-main">
        <button class="btn btn-start" onclick="startAuto()">▶ 開始</button>
        <button class="btn btn-stop" onclick="stopAuto()">⏹ 停止</button>
        <button class="btn btn-reset" onclick="resetPos()">⟲ リセット</button>
      </div>
      <div class="slider-group">
        <span class="slider-label">自動速度</span>
        <button class="slider-btn" onclick="slower()">−</button>
        <input id="speedRange" type="range" min="200" max="3000" step="50" value="900" oninput="setSpeed(this.value)">
        <button class="slider-btn" onclick="faster()">+</button>
        <span class="slider-value" id="speedLabel">900ms</span>
      </div>
    </div>
  </div>

  <!-- 本文エリア -->
  <div class="card">
    <div class="card-header">
      <span class="icon">📜</span>
      <span class="label">外郎売（縦書き）</span>
    </div>
    <div class="card-body" style="padding-bottom:10px;">
      <div class="status-bar">
        <span><span class="status-dot idle" id="statusDot"></span></span>
        <span id="statusText">停止中 — スワイプまたは「開始」で読み進めましょう</span>
      </div>
      <div id="reader">
        <div id="textBody">読み込み中…</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="tips">
        <div class="tips-title">💡 練習のコツ</div>
        <div class="tips-text">
          ・まずはゆっくり、一文ずつ声に出して読みましょう<br>
          ・慣れてきたら速度を上げてみましょう<br>
          ・スマホの場合は横向きにすると読みやすくなります
        </div>
      </div>
    </div>
  </div>

</div>

<script>

const RAW_TEXT = `
拙者せっしゃ親方おやかたと申もうすは、お立たち会 あいの中 うちに御存ごぞんじのお方かたもござりましょうが、
お江戸えどを発たって二十里にじゅうり上方かみがた、相州 そうしゅう小田原おだわら一色町 いっしきまちをお過すぎなされて、
青物あおもの町 ちょうを上のぼりへお出いでなさるれば、欄干らんかん橋 ばし虎屋とらや藤 と右衛門うえもん、
只今ただいまは剃髪ていはつ致いたして圓えん斎 さいと名乗なのりまする。

元朝がんちょうより大晦日 おおつごもりまで、御手おてに入いれまする此 この薬くすりは、
昔むかし、珍ちんの国くにの唐人とうじん、外郎ういろうと云いう人ひと、我わが朝 ちょうへ来きたり。
帝みかどへ参内さんだいの折 おりから、此 この薬くすりを深ふかく込こめ置おき、
用 もちゆる時ときは一いち粒 りゅうずつ冠かんむりの隙間すきまより取とり出 いだす。
依よってその名なを帝みかどより、透頂香 とうちんこうと賜たまわる。
即すなわち文字もじには、「頂 いただき、透すく、香 におい」と書か いて「とうちんこう」と申もうす。

只今ただいまは此 この薬くすり、殊ことの外ほか、世上 せじょうに広ひろまり、
方々 ほうぼうに似にせ看板かんばんを出 いだし、イヤ小田原おだわらの、灰はい俵 だわらの、

もしやお立たち会 あいの中 うちに、熱海あたみか塔ノ沢とうのさわへ湯治とうじにお出いでなさるるか、

御 お上のぼりなれば右みぎの方 かた、御 お下くだりなれば左側ひだりがわ、八方はっぽうが八 やつ棟 むね、

正身 しょうしんの胡椒の丸呑こしょうのまるのみ、白河夜船しらかわよふね。
さらば一いち粒 りゅう食たべかけて、その気味合きみあいをお目めに懸かけましょう。
先まず此 この薬くすりを斯様かように一いち粒 りゅう舌したの上うえへ乗のせまして、
腹 ふく内ないへ納おさめますると、イヤどうもいえぬは、胃い、心 しん、肺はい、
肝 かんが健すこやかに成なって、薫風くんぷう喉のどより来きたり、
口中 こうちゅう微び涼りょうを生しょうずるが如ごとし。
魚 ぎょ鳥 ちょう、木きの子こ、麺類めんるいの食くい合あわせ、其その外ほか、

さて此 この薬くすり、第一だいいちの奇妙きみょうには、舌したの廻 まわることが

そりゃそりゃそりゃ、そりゃそりゃ、廻まわって来きたわ、廻まわって来くるわ。
アワヤ喉のど、サタラナ舌したにカ牙 げサ歯音しおん、ハマの二ふたつは唇くちびるの

河原撫子かわらなでしこ野石 のぜき竹 ちく。野良のら如来にょらい野良のら如来にょらい、

起おきゃがれ小法師 こぼし、起おきゃがれ小法師 こぼし、昨夜 ゆんべも溢 こぼしてまた溢 こぼした。
たぁぷぽぽ、たぁぷぽぽ、ちりからちりから、つったっぽ。
たっぽたっぽ一丁いっちょう蛸だこ、落 おちたら煮にて食くを。

鮒ふな、金柑きんかん、椎茸しいたけ、定さだめて後段 ごだんな、蕎麦切そばきり、

小棚 こだなの小下こしたに、小桶こおけにこ味噌みそがこ有あるぞ、
こ杓子しゃくしこ持 もって、こすくてこ寄よこせ。
おっと合点がてんだ、心得こころえ田圃たんぼの川崎かわさき、神奈川かながわ、
程ほどヶ谷 がや、戸塚とつかは走はしって行 ゆけば、灸やいとを擦すりむく、
三里さんりばかりか、藤沢ふじさわ、平塚ひらつか、大磯おおいそがしや、
小磯こいその宿やどを七ななつ起おきして、早天そうてんそうそう、
相州 そうしゅう小田原おだわら、透 とう頂 ちん香こう。
隠かくれござらぬ貴賎きせん群衆 ぐんじゅの花はなの御 お江戸えどの花はなういろう。
あれ、あの花はなを見みて、お心こころをお和やわらぎやという。
産 うぶ子こ、這子 はうこに至いたるまで、此 このういろうの御ご評判ひょうばん、
御存ごぞんじないとは申もうされまいまいつぶり、角出 つのだせ、棒ぼう出だせ、
ぼうぼう眉まゆに、臼うす、杵きね、擂鉢すりばち、ばちばち、ぐゎらぐゎらぐゎらと、
羽目はめを外はずして今日 こんにち御 おい出 での何 いずれ様 さまに、
上あげねばならぬ、売うらねばならぬと、息いきせい引ひっ張ぱり、
東方とうほう世界せかいの薬くすりの元締もとじめ、薬師如来やくしにょらいも照覧 しょうらんあれと、
ホホ敬うやまって、ういろうはいらっしゃりませぬか。

/* ======================================================
  自動ruby化
====================================================== */
function isKanji(ch) { return /[一-龥々]/.test(ch); }
function isHiragana(ch) { return /[ぁ-ゖーゝゞ]/.test(ch); }
function isSpace(ch) { return ch === " " || ch === "\u3000"; }
function escapeHtml(s) {
  return (s + "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function autoRuby(text) {
  let out = "";
  let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (c === "\n" || c === "\r") { out += "\n"; i++; continue; }
    if (isKanji(c)) {
      let kanjiRun = c; i++;
      while (i < text.length && isKanji(text[i])) { kanjiRun += text[i]; i++; }
      while (i < text.length && isSpace(text[i])) i++;
      let hiraRun = "";
      while (i < text.length && isHiragana(text[i])) { hiraRun += text[i]; i++; }
      if (hiraRun.length > 0) {
        out += `<ruby>${escapeHtml(kanjiRun)}<rt>${escapeHtml(hiraRun)}</rt></ruby>`;
      } else {
        out += escapeHtml(kanjiRun);
      }
      continue;
    }
    out += escapeHtml(c);
    i++;
  }
  return out;
}

function render() {
  document.getElementById("textBody").innerHTML = autoRuby(RAW_TEXT);
}
render();

function closeOnboarding() {

  el.style.opacity = "0";
  el.style.transform = "translateY(-10px)";
  el.style.transition = "all .3s ease";
  setTimeout(() => el.style.display = "none", 300);

}

  }

/* ======================================================
  自動スライド（シンプル版・縦線なし）
====================================================== */
let speed = 900;
let timer = null;

function updateSpeedLabel() {
  document.getElementById("speedLabel").textContent = speed + "ms";
  document.getElementById("speedRange").value = String(speed);
}
updateSpeedLabel();

function setSpeed(v) {
  speed = Number(v);
  updateSpeedLabel();
  if (timer) startAuto();
}

function updateStatus(playing) {
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("statusText");
  if (playing) {
    dot.className = "status-dot playing";
    txt.textContent = "再生中 — 声に出して読みましょう！";
  } else {
    dot.className = "status-dot idle";
    txt.textContent = "停止中 — スワイプまたは「開始」で読み進めましょう";
  }
}

function updateProgress() {
  const reader = document.getElementById("reader");
  const max = reader.scrollWidth - reader.clientWidth;
  // direction:rtl ではscrollLeftが0〜負の値になる
  const scrolled = Math.abs(reader.scrollLeft);
  const pct = max > 0 ? Math.min(100, (scrolled / max) * 100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

document.getElementById("reader").addEventListener("scroll", updateProgress);

function startAuto() {
  stopAuto();
  updateStatus(true);
  const reader = document.getElementById("reader");
  timer = setInterval(() => {
    // direction:rtl では負の方向にスクロール
    reader.scrollLeft -= 18;
    updateProgress();
    const max = reader.scrollWidth - reader.clientWidth;
    if (Math.abs(reader.scrollLeft) >= max - 2) {
      stopAuto();
    }
  }, speed);
}

function stopAuto() {
  if (timer) { clearInterval(timer); timer = null; }
  updateStatus(false);
}

function resetPos() {
  stopAuto();
  document.getElementById("reader").scrollLeft = 0;
  updateProgress();
}

function slower() {
  speed = Math.min(speed + 120, 3000);
  updateSpeedLabel();
  if (timer) startAuto();
}
function faster() {
  speed = Math.max(speed - 120, 200);
  updateSpeedLabel();
  if (timer) startAuto();
}
</script>
